<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get the SMS alert · E2b live demo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23cf3328'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/live.css">
</head>
<body class="join-body">
<main class="join-card">
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="hy" aria-pressed="false">ՀՅ</button>
  </div>

  <form id="form" novalidate>
    <h1 data-t="title"></h1>
    <p data-t="intro"></p>
    <div class="field">
      <label for="phone" data-t="phone"></label>
      <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" value="+374 " required>
    </div>
    <div class="check">
      <input id="consent" type="checkbox" required>
      <label for="consent" data-t="consent"></label>
    </div>
    <p class="privacy" data-t="privacy"></p>
    <button class="btn wide" type="submit" id="submit" data-t="submit"></button>
    <p class="form-error" id="error" role="alert"></p>
  </form>

  <section class="success" id="success" hidden aria-live="polite">
    <div class="big-check" aria-hidden="true">✓</div>
    <h1 data-t="doneTitle"></h1>
    <p data-t="doneText"></p>
    <p id="masked"></p>
    <p class="warn-note" id="welcome-failed" data-t="welcomeFailed" hidden></p>
    <p><a class="live-link" href="/live"><span class="live-badge">LIVE</span><span data-t="watch"></span></a></p>
  </section>
</main>
<script>
const T = {
  en: {
    title: "Get an SMS when the substation overload happens",
    intro: "When your substation gets over its limit, your phone gets the same alert a grid operator would.",
    phone: "Mobile number",
    consent: "I agree to receive SMS alerts from the E2b live demo.",
    privacy: "SMS come in the language selected above. Your number is deleted after 24 h and is never shown on screen.",
    submit: "Sign up",
    doneTitle: "You're in!",
    doneText: "Watch the screen: when the dot turns red, your phone buzzes.",
    welcomeFailed: "We couldn't send the welcome SMS, but you are signed up for the alert.",
    watch: "Watch it live",
    invalid_phone: "Please enter a valid mobile number, e.g. +374 77 123456.",
    consent_required: "Please tick the consent box.",
    too_many_requests: "Too many sign-ups from this network. Please wait a minute.",
    network: "No connection. Please try again.",
  },
  hy: {
    title: "Ստացեք SMS ենթակայանի գերբեռնման պահին",
    intro: "Երբ Ձեր ենթակայանը գերբեռնի, ձեր հեռախոսը կստանա նույն ահազանգը, ինչ ցանցի օպերատորը։",
    phone: "Բջջային համար",
    consent: "Համաձայն եմ ստանալ SMS ծանուցումներ E2b կենդանի ցուցադրությունից։",
    privacy: "SMS-ները կգան վերևում ընտրված լեզվով։ Ձեր համարը կջնջվի 24 ժամ հետո և երբեք չի ցուցադրվի էկրանին։",
    submit: "Գրանցվել",
    doneTitle: "Դուք գրանցված եք։",
    doneText: "Հետևեք էկրանին. երբ կետը կարմրի, ձեր հեռախոսը կզնգա։",
    welcomeFailed: "Չհաջողվեց ուղարկել ողջույնի SMS-ը, բայց դուք գրանցված եք ահազանգի համար։",
    watch: "Դիտել ուղիղ եթերում",
    invalid_phone: "Մուտքագրեք ճիշտ բջջային համար, օրինակ՝ +374 77 123456։",
    consent_required: "Խնդրում ենք նշել համաձայնության վանդակը։",
    too_many_requests: "Այս ցանցից չափազանց շատ գրանցումներ։ Սպասեք մեկ րոպե։",
    network: "Կապ չկա։ Փորձեք կրկին։",
  },
};
// ALERT_CHANNEL=email: the same page asks for an email address instead of a phone number
const EMAIL_T = {
  en: {
    title: "Get an email when the substation overload happens",
    intro: "When your substation gets over its limit, you get the same alert a grid operator would.",
    phone: "Email address",
    consent: "I agree to receive email alerts from the E2b live demo.",
    privacy: "Emails come in the language selected above. Your address is deleted after 24 h and is never shown on screen.",
    doneText: "Watch the screen: when the dot turns red, an email lands in your inbox.",
    welcomeFailed: "We couldn't send the welcome email, but you are signed up for the alert.",
    invalid_email: "Please enter a valid email address, e.g. name@example.com.",
  },
  hy: {
    title: "Ստացեք նամակ ենթակայանի գերբեռնման պահին",
    intro: "Երբ Ձեր ենթակայանը գերբեռնի, դուք կստանաք նույն ահազանգը, ինչ ցանցի օպերատորը։",
    phone: "Էլ. փոստի հասցե",
    consent: "Համաձայն եմ ստանալ էլ. փոստով ծանուցումներ E2b կենդանի ցուցադրությունից։",
    privacy: "Նամակները կգան վերևում ընտրված լեզվով։ Ձեր հասցեն կջնջվի 24 ժամ հետո և երբեք չի ցուցադրվի էկրանին։",
    doneText: "Հետևեք էկրանին. երբ կետը կարմրի, նամակ կստանաք ձեր փոստարկղում։",
    welcomeFailed: "Չհաջողվեց ուղարկել ողջույնի նամակը, բայց դուք գրանցված եք ահազանգի համար։",
    invalid_email: "Մուտքագրեք ճիշտ էլ. փոստի հասցե, օրինակ՝ name@example.com։",
  },
};
let channel = "sms";
let lang = (navigator.language || "").toLowerCase().startsWith("hy") ? "hy" : "en";
const $ = id => document.getElementById(id);

function t(key) { return (channel === "email" && EMAIL_T[lang][key]) || T[lang][key]; }

function useChannel(c) {
  channel = c === "email" ? "email" : "sms";
  const f = $("phone");
  if (channel === "email") {
    f.type = "email"; f.inputMode = "email"; f.autocomplete = "email"; f.value = ""; f.placeholder = "name@example.com";
  } else {
    f.type = "tel"; f.inputMode = "tel"; f.autocomplete = "tel"; f.placeholder = "";
    if (!f.value) f.value = "+374 ";
  }
  document.title = channel === "email" ? "Get email alerts · E2b live demo" : "Get the SMS alert · E2b live demo";
  apply();
}

function apply() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".lang-switch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  $("error").textContent = "";
}
document.querySelectorAll(".lang-switch button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; apply(); }));
apply();
fetch("/api/demo/channel", { cache: "no-store" }).then(r => r.json()).then(d => useChannel(d.channel)).catch(() => {});

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  $("error").textContent = "";
  const contact = $("phone").value.trim();
  if (!$("consent").checked) { $("error").textContent = t("consent_required"); return; }
  if (channel === "email" && !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(contact)) { $("error").textContent = t("invalid_email"); return; }
  if (channel === "sms" && contact.replace(/\D/g, "").length < 8) { $("error").textContent = t("invalid_phone"); return; }
  $("submit").disabled = true;
  try {
    const r = await fetch("/api/demo/subscribe", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(channel === "email" ? { email: contact, lang, consent: true } : { phone: contact, lang, consent: true }),
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) {
      const fallback = channel === "email" ? "invalid_email" : "invalid_phone";
      const code = typeof body.detail === "string" ? body.detail : fallback;
      $("error").textContent = t(code) || t(fallback);
      return;
    }
    $("form").hidden = true;
    $("success").hidden = false;
    $("masked").textContent = body.masked;
    $("welcome-failed").hidden = body.welcomeSent !== false;
  } catch (e) {
    $("error").textContent = t("network");
  } finally {
    $("submit").disabled = false;
  }
});
</script>
</body>
</html>
