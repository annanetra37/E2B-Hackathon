# ============================================================================
#  SUBSTATION LIST  (ELI5: the gateway's phone book + the map's address book)
# ============================================================================
# Every substation here appears on the map and gets its own diagram page.
# To add one: copy a block under "substations" and change it.
# For the REAL grid you only change this file (IPs, ports, addresses).
#
# Two kinds of substation are supported:
#   type: primary       big 110/10 kV substation (meters + transformer monitor via
#                       Modbus TCP, breakers + frequency via an IEC 104 RTU)
#   type: distribution  small transformer station, 10/35/110 kV -> 0.4 kV
#                       (everything via Modbus TCP, like the hand-drawn sketch)

poll_interval_s: 2          # how often the gateway asks every device
history_interval_s: 10      # how often values are saved for the trend charts
retention_hours: 24         # older history is deleted (env RETENTION_HOURS overrides)
database: data/gateway.db   # SQLite file (env GATEWAY_DB overrides)

# ---------------------------------------------------------------------------
# REGISTER MAPS: which "drawer" holds which value, per device type.
# (Real devices: copy these from the device manual's register map.)
# ---------------------------------------------------------------------------
templates:
  # --- primary substations ---
  meter:
    - {name: voltage, address: 0, type: float32, unit: kV}
    - {name: current, address: 2, type: float32, unit: A}
    - {name: power,   address: 4, type: float32, unit: MW}
  transformer:
    - {name: oil_temp, address: 0, type: float32, unit: "°C"}
    - {name: load,     address: 2, type: float32, unit: "%"}
    - {name: tap,      address: 4, type: uint16,  unit: ""}
  # --- distribution transformer stations ---
  lv_meter:                       # 0.4 kV main meter on the busbar
    - {name: v_l1,  address: 0,  type: float32, unit: V}
    - {name: v_l2,  address: 2,  type: float32, unit: V}
    - {name: v_l3,  address: 4,  type: float32, unit: V}
    - {name: i_l1,  address: 6,  type: float32, unit: A}
    - {name: i_l2,  address: 8,  type: float32, unit: A}
    - {name: i_l3,  address: 10, type: float32, unit: A}
    - {name: power, address: 12, type: float32, unit: kW}
  temp_sensor:                    # transformer temperature ("T = 63" in the sketch)
    - {name: temperature, address: 0, type: float32, unit: "°C"}
  di_module:                      # digital inputs: disconnector position
    - {name: disconnector_closed, address: 0, type: uint16, unit: ""}
  ct_meter:                       # current transformers on an outgoing line
    - {name: i_l1, address: 0, type: float32, unit: A}
    - {name: i_l2, address: 2, type: float32, unit: A}
    - {name: i_l3, address: 4, type: float32, unit: A}

# ---------------------------------------------------------------------------
# STANDARD LAYOUTS: where each element's data comes from.
#
# primary (110/10 kV):
#   110 kV line ── Q0 ── T1 ── Q1 ── 10 kV busbar ──┬── F1, F2 ...
#   Modbus unit IDs: 1 line meter, 2 transformer monitor, 3 busbar meter, 11+ feeder meters
#   IEC 104 IOAs:    1001 frequency, 2001 Q0, 2002 Q1, 2101+ feeder breakers
#
# distribution (10/35/110 kV -> 0.4 kV), as in the sketch:
#   MV line ── QS disconnector ── FU fuses ── T transformer ── 0.4 kV busbar ──┬── W1, W2 ...
#   Modbus unit IDs: 1 LV meter (L1/L2/L3), 2 temperature sensor, 3 digital inputs,
#                    11+ current meters on the outgoing lines that have CTs
# ---------------------------------------------------------------------------
layout:
  primary:
    line_meter_unit: 1
    transformer_unit: 2
    bus_meter_unit: 3
    feeder_meter_unit_start: 11
    ioa_frequency: 1001
    ioa_line_breaker: 2001
    ioa_transformer_breaker: 2002
    ioa_feeder_breaker_start: 2101
  distribution:
    lv_meter_unit: 1
    temp_sensor_unit: 2
    di_module_unit: 3
    ct_meter_unit_start: 11

# ---------------------------------------------------------------------------
# LIMITS: when is something "warning" (amber) or "fault" (red)?
# ---------------------------------------------------------------------------
limits:
  line_kv:      {nominal: 110,  warn_pct: 5,  fault_pct: 10}
  bus_kv:       {nominal: 10.5, warn_pct: 7,  fault_pct: 12}
  frequency_hz: {warn_low: 49.8, warn_high: 50.2, fault_low: 49.5, fault_high: 50.5}
  oil_temp_c:   {warn: 75, fault: 85}
  load_pct:     {warn: 90, fault: 100}
  feeder_a:     {warn: 340, fault: 400}
  lv_v:         {nominal: 230, warn_pct: 6, fault_pct: 10}   # 207-253 V is the legal band
  lv_feeder_pct: {warn: 85, fault: 100}                      # % of the line's rated current

